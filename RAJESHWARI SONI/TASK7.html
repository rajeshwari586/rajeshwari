<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
   <style>

    body{
        font-family: Arial, Helvetica, sans-serif;
        background-color: aliceblue;
        padding: 30px;
        text-align: center;
    }

    h1{
        text-align: center;
        color: #0f3554;

    }
      table {
        border-collapse: collapse;
        width: 80%;
        margin: auto ;
        height: 300px;
      }

      th td {
        border: 1px solid #12344e;
        text-align: center;
        padding: 16px;
      }

      th {
        background: #12344e;
        color: rgb(243, 234, 234);
      }

      td {
        background: white;
        color: #12344e;
      }

      .total-row td, .total-row th {
        background-color: #12344e;
        color: rgb(250, 246, 246);
        font-weight: bold;
      }

      .result {
          width: 70%;
          margin: 10px auto;
          font-weight: bold;
          color: #12344e;
          text-align: start;
      }

   </style>
</head>
<body>
      <h1>Students Marksheet</h1>

      <table>
        <tr>
            <th>Subject</th>
            <th>Maximum</th>
            <th>Obtained</th>
        </tr>
        <tr>
            <td>HTML</td>
            <td>100</td>
            <td>85</td>
        </tr>
        <tr>
            <td>CSS</td>
            <td>100</td>
            <td>80</td>
        </tr>
        <tr>
            <td>Python</td>
            <td>100</td>
            <td>90</td>
        </tr>
        <tr>
            <td>C++</td>
            <td>100</td>
            <td>75</td>
        </tr>
        <tr class="total-row">
            <td>Total</td>
            <td>400</td>
            <td>330</td>
        </tr>
      </table>

      <div class="result">Result: PASS</div>
</body>
</html>
