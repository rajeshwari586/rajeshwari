<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width>, initial-scale=1.0">
    <title>HTML FORM</title>
    <style>
         body {
    font-family: Arial, sans-serif;
    background-color: #eaf2ff;
    margin: 0;
    padding: 50px;
    color: #071b70;
}

h1 {
    text-align: center;
    color: #071b70;
    margin-bottom: 25px;
}

form {
    width: 400px;
    margin: auto;
    background-color: white;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
}

input[type="text"],
input[type="email"],
input[type="password"],
select {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    margin-bottom: 15px;
    border: 1px solid #b5c7e3;
    border-radius: 6px;
    outline: none;
    font-size: 15px;
}

input[type="text"]:focus,
input[type="email"]:focus,
input[type="password"]:focus,
select:focus {
    border-color: #071b70;
    box-shadow: 0 0 5px rgba(7, 27, 112, 0.3);
}

input[type="radio"],
input[type="checkbox"] {
    margin-right: 5px;
}

input[type="submit"],
input[type="reset"] {
    padding: 10px 25px;
    border: none;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
    margin-top: 15px;
}

input[type="submit"] {
    background-color: #071b70;
    color: white;
}

input[type="submit"]:hover {
    background-color: #55428b;
}

input[type="reset"] {
    background-color: #ff2200;
    color: white;
    margin-left: 10px;
}

input[type="reset"]:hover {
    background-color: rgb(44, 44, 90);
}
       
        

        
        
    </style>
</head>
<body>
    <h1>MY FORM</h1>
    <form action="skillbar.html">
       
        Name:
        <input type="text" name="name">

        <br><br>

        Email:
        <input type="email" name="email">

        <br><br>

        <select name="city" id="city">
            <option value="delhi">delhi</option>
            <option value="indore">indore</option>
            <option value="bhopal">bhopal</option>
        </select>

        Password:
        <input type="password" name="password">
        </select>

        <br><br>

        Gender:
        <input type="radio" name="gender">
        Male 
        <input type="radio" name="gender">
        Female

        <br><br>

        Hobbies:
        <input type="checkbox"> Reading
        <input type="checkbox"> Sports

        <br><br>

        <input type="submit" value="submit">
        <input type="reset" value="reset">
 </form>
</body>
</html>
