<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: white;
            margin: 0;
            padding: 20;
        }

        h1 {
            text-align: center;
            color: black;
        }

        .pricing-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }

        .card {
            background-color: aliceblue;
            border: 1px solid palegoldenrod;
            border-radius: 10px;
            width: 300px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 2px 2px 10px pink;
        }

        .card h2 {
            color: rgb(35, 35, 114);
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: rgb(35, 35, 114);
            margin: 20px 0;
        }

        .card p {
            color: #050404;
            margin: 8px;
            font-size: 14px;
        }

        .card button {
            background-color: rgb(51, 177, 135);
            color: white;
            border: none;
            padding: 10px 25px;
            margin-top: 15px;
            cursor: pointer;
        }

        .card button:hover {
            background-color: aqua;
        }
        
    </style>
</head>
<body>
    <h1>pricing plans</h1>
    
    <div class="pricing-container">

        <div class="card">
            <h2>Basic</h2>
            <div class="price">₹499</div>
            <p>5 Projects</p>
            <p>10 GB storage</p>
            <button>choose</button>
        </div>

        <div class="card">
           <h2>standard</h2>
           <div class="price">₹999</div>
           <p>20 Projects</p>
           <p>50 GB storage</p>
           <button>choose</button>
        </div>

        <div class="card">
           <h2>premium</h2>
           <div class="price">₹1999</div>
           <p>Unlimited projects</p>
           <p>100 GB storage</p>
           <button>choose</button>
        </div>
    </div>

</body>
</html>
