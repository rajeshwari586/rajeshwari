<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
           font-family: Arial, sans-serif;
           background: #0875d1;
           min-height: 50vh;
           display: flex;
           justify-content: center;
           align-items: center;
           padding-bottom: 100px;
        }

        .login-box {
            width: 330px;
            padding: 35px 28px;
            background: aliceblue;
            border-radius: 12px;
            box-shadow: 0 4px 15px black;
            text-align: center;
        }

        .login-box h2 {
            color: black;
            font-size: 28px;
            margin-bottom: 28px;
        }

        .login-box input {
            width: 100%;
            height: 40px;
            margin-bottom: 16px;
            padding: 6px;
            border: 1px solid #081624;
            border-radius: 3px;
            outline: none;
            font-size: 14px;
        }

        .login-box input:focus {
            border-color: #06365e;
        }

        .login-box button {
            width: 100%;
            height:40px;
            background: #014c7e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;

        }

        .login-box button:hover {
            border-color: #0875d1;
        }

        .login-box a {
            display: inline-block;
            margin-top: 18px;
            color: #333;
            text-decoration: none;
            font-size: 14px;
        }

        .login-box a:hover {
            text-decoration: underline;
        }

        
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Login</h2>
        <form>
            <input type="email" placeholder="Email" required>
            <input type="password" placeholder="password" required>
            <button type="submit">Login</button>
            <a href="#">Forget password</a>
        </form>
    </div>
</body>
</html>
