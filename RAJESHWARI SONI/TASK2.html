<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKILL BAR</title>
    <style>
        .skill {
            width: 100%;
            background: rgb(241, 179, 208);
        }

        .html {
            width: 90%;
            background-color: rgb(180, 155, 238);
            color: red;
            text-align: center;
            border-radius: 8%;
        }

        .css {
            width: 85%;
            background-color:rgb(243, 202, 20) ;
            color: blue;
            text-align: center;
            border-radius: 10% 50% 10% 50%;
        }
            

        .javascript {
            width:80%;
            background-color: rgb(24, 226, 192);
            color: rgb(192, 8, 78);
            text-align: center;
            border-radius: 30% 70%/50% 50%;
        }

        .python {
            width: 75%;
            background-color: rgb(86, 136, 241);
            color: rgb(128, 0, 107);
            text-align: center;
            border-radius: 60%;
        }
    </style>
</head>
<body>
      <h1 class="My skills"></h1>
      <P>HTML</P>
      <div class="skill bar">
        <div class="html">90%</div>
      </div>

      <p>CSS</p>
      <div class="skill bar">
      <div class="css">89%</div>
      </div>

      <p>JAVASCRIPT</p>
        <div class="skill bar">
        <div class="javascript">79%</div>
        </div>

      <P>PYTHON</P>
        <div class="skill bar">
        <div class="python">75%</div>
        </div>
      
</body>
</html>
