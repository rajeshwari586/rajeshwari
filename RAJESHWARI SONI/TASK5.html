<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial;
            background-color: white;
            margin: 0;
            padding: 10px;
        }

        h1 {
            text-align: center;
            font-size: 40px;
            color: #222;
        }

        .gallary {
            display: grid;
            grid-template-columns: repeat(3,1fr);
            gap: 15px;
            padding: 30px;
        }

        .gallary img {
            width: 100%;
            height: 300px;
            border-radius: 10px;
            object-fit: cover;
        }

        .gallary img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <header>
        <h1>My gallary</h1>
    </header>

    <div class="gallary">
        <img src="https://th.bing.com/th/id/OIP.BueJsqYAPaaLmDjKR2EZLAHaHa?w=140&h=150&c=6&r=0&o=7&pid=1.7&rm=3" alt="img1">
