<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: aliceblue;
        justify-content: center;
        align-items: center;
        margin: 0;
        padding: 0;
      }

      h1 {
        color: rgb(32, 65, 75);
        font-size: 40px;
        font-weight: bold;
        text-align: center;
      }

    
      .items {
        margin: 24px auto;
        padding: 24px;
        border-radius: 6px;
        width: 60%;
        border: 1px solid #242424;
        justify-content: center;
        text-align: start;
        font-size: 20px;
      }

      .Price {
       
        margin: 700px;
        text-align: end;
        color: rgb(20, 54, 63);
        font-weight: bold;
        font-size: 20px;
        
      }
       
      
    </style>
</head>
<body>
        <h1>🍴Restaurant Menu</h1>

      <div class="Menu">
        <div class="items">
          <span>Pizza</span>
          <span class="Price">₹199</span>
        </div>

        <div class="items">
           <span>Burger</span>
           <span class="Price">₹99</span>
        </div>

        <div class="items">
          <span>Pasta</span>
          <span class="Price">₹149</span>
        </div>

        <div class="items">
          <span>Sandwich</span>
          <span class="Price">₹79</span>
        </div>

        <div class="items">
          <span>Cold Coffee</span>
          <span class="Price">₹50</span>
        </div>
      </div>
</body>
</html>
